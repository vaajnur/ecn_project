<article class="service-example">
  <div class="service-example__intro">
    <h2 class="service-example__title" id="service-example-{{id}}">{{title}}</h2>
    <img class="service-example__image" src="{{image}}" alt="{{imageAlt}}">
    <p class="service-example__description">{{description}}</p>
    <a class="service-example__request" href="mailto:info@ec-systems.ru">Отправить запрос</a>
  </div>
  <div class="service-example__details">
    <h3 class="service-example__subtitle">Технические параметры</h3>
    <ul class="service-example__list">{{parameters}}</ul>
    <form class="service-example__form" action="#" method="post">
      <label class="visually-hidden" for="example-name-{{id}}">Имя</label>
      <input id="example-name-{{id}}" name="name" type="text" autocomplete="name">
      <label class="visually-hidden" for="example-phone-{{id}}">Телефон</label>
      <input id="example-phone-{{id}}" name="phone" type="tel" autocomplete="tel">
      <label class="visually-hidden" for="example-email-{{id}}">Почта</label>
      <input id="example-email-{{id}}" name="email" type="email" autocomplete="email">
      <button type="submit">Подробнее</button>
    </form>
  </div>
</article>
